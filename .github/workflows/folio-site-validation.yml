name: Folio site validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/register.js"
      - "src/styles/print.css"
      - "site/**"
      - "tools/build-site.mjs"
      - "tools/recipe-metadata.mjs"
      - "tests/fixtures/profiles/**"
      - "tests/fixtures/journal/**"
      - "tools/journal-recipe-metadata.mjs"
      - "tests/site-build.test.mjs"
      - "tests/run-site-browser-tests.mjs"
      - "docs/AGENT-USAGE.md"
      - "docs/requirements/FOLIO-SITE-REQUIREMENTS.md"
      - "AGENTS.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/folio-site-validation.yml"
      - ".github/workflows/deploy-folio-pages.yml"
      - "src/**"
      - "tests/conformance/**"
      - "tests/fixtures/**"
      - "tests/run-ui-conformance.mjs"
      - "tests/ui-conformance-rules.test.mjs"
      - "tests/ui-conformance-evidence.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build and validate Folio documentation
        run: npm run site:check

      - name: Install documentation test browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Folio documentation browser checks
        run: npm run site:test:browser

  # GH-54: universal UI layout/interaction conformance
  # (visual-engineering/UI-LAYOUT-INTERACTION@1.0.0: ULI-L12 print preview and
  # PDF, ULI-L13 stylesheets, ULI-A01..A10 / L05 / L06 / L09 for the site and
  # previews). Runs beside the existing validation job; it disables nothing.
  ui-conformance:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install dependencies
        run: npm ci

      - name: Install conformance browser
        run: npx playwright install --with-deps chromium

      - name: Run ULI print/PDF and site conformance
        env:
          # evidence.json records the commit under review, not the PR merge ref.
          UI_CONFORMANCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run ui:conformance

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-conformance-evidence
          path: test-results/ui-conformance/
          if-no-files-found: warn
