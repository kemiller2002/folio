name: Generate machine-operability retrofit audit
# rerun after catalog-wide audit correction

on:
  push:
    branches: [feature/machine-operability-retrofit]
    paths:
      - ".github/workflows/generate-machine-operability-retrofit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate audit and ROS evidence
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git merge-base origin/main HEAD)"
          npm ci
          npm run test:machine:audit
          npm run machine:audit

          ./ros add "Establish Folio machine-operability retrofit audit" --id "FOLIO-GH-35" --tag folio,machine-operability,audit --priority high --source github-issue --source-reference "https://github.com/kemiller2002/folio/issues/35" --actor "agent:openai-chatgpt"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ./ros work backlog-transition --action ready --id "FOLIO-GH-35" --occurred-at "$NOW"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ./ros work start --id "FOLIO-GH-35" --occurred-at "$NOW" --type task
          git rm .github/workflows/generate-machine-operability-retrofit.yml
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ROS_BASE_REF="$BASE_SHA" ./ros work complete --id "FOLIO-GH-35" --occurred-at "$NOW" --evidence implementation=tools/machine-operability-audit.mjs --evidence tests=tests/machine-operability-audit.test.mjs --evidence documentation=docs/MACHINE-OPERABILITY-AUDIT.md --evidence implementation=contracts/machine-operability-catalog.json
          ./ros registry build
          ROS_BASE_REF="$BASE_SHA" ./ros validate
          ./ros status

      - name: Commit generated audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -d .ros/telemetry ]; then git add -f .ros/telemetry; fi
          git commit -m "FOLIO-GH-35 record machine-operability retrofit audit"
          git pull --rebase origin feature/machine-operability-retrofit
          git push origin HEAD:feature/machine-operability-retrofit
