name: Deploy Folio documentation

on:
  push:
    branches: [main]
    paths:
      - "src/components/register.js"
      - "src/styles/print.css"
      - "site/**"
      - "tools/build-site.mjs"
      - "tools/recipe-metadata.mjs"
      - "tests/fixtures/profiles/**"
      - "tools/core-component-metadata.mjs"
      - "tests/fixtures/reports/**"
      - "tests/site-build.test.mjs"
      - "docs/AGENT-USAGE.md"
      - "docs/requirements/FOLIO-SITE-REQUIREMENTS.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-folio-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: folio-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build and validate Folio documentation
        run: npm run site:check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
