name: Reconcile Folio pinned icons attribution
on:
  push:
    branches: [feature/folio-forma-icons-current]
    paths: [.github/workflows/reconcile-forma-print.yml]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'kemiller2002/folio'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - name: Test and attribute real commits to Folio GH-45
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          chmod +x ./praxis
          node tests/run-forma-icon-tests.mjs
          ./praxis registry check
          if ! ./praxis work show GH-45 >/dev/null 2>&1; then
            ./praxis add "Integrate pinned Forma icons into Folio print rendering" --id GH-45 --source github-issue --source-reference "https://github.com/kemiller2002/folio/issues/45" --priority high
          fi
          base="$(git merge-base HEAD origin/main)"
          now="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          reason="GitHub connector authored icon print adapter outside an executable Praxis session; recover post-hoc attribution from Git commits"
          ./praxis work reconcile --id GH-45 --reason "$reason" --range "$base..HEAD" --occurred-at "$now" --dry-run
          ./praxis work reconcile --id GH-45 --reason "$reason" --range "$base..HEAD" --occurred-at "$now"
          ./praxis registry build
          ./praxis validate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ros/work .ros/events .ros/telemetry registries
          if ! git diff --cached --quiet; then
            git commit -m "praxis: reconcile pinned Folio icon adapter GH-45"
            git push origin HEAD:feature/folio-forma-icons-current
          fi
