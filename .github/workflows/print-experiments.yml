name: Print experiments

concurrency:
  group: print-experiments-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "tests/**"
      - "tools/diagram-projection.mjs"
      - "tools/forma-icons.mjs"
      - "tools/forma-icon-print.mjs"
      - ".github/workflows/print-experiments.yml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "tests/**"
      - "tools/diagram-projection.mjs"
      - "tools/forma-icons.mjs"
      - "tools/forma-icon-print.mjs"
      - ".github/workflows/print-experiments.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  print-experiments:
    if: github.actor != 'github-actions[bot]'
    # Pinned, not ubuntu-latest: the grayscale-PDF text assertion is an oracle over
    # Ghostscript's pdfwrite output. ubuntu-latest became ubuntu-26.04 (Ghostscript
    # 10.06) around 2026-10-22, and 10.06 detaches ligature glyphs ("fi", "ff") from
    # their words in the re-encoded fonts, so "Fulfilment" extracts as "Ful fi lment".
    # Ghostscript 10.02 (ubuntu-24.04) preserves them. Move this pin deliberately,
    # together with a re-verified oracle, not by image drift (WI-0013).
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils ghostscript

      - name: Install JavaScript test dependencies
        run: npm ci

      - name: Install test browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run print experiments
        run: npm test

      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-experiment-evidence
          path: |
            test-results/print-experiments/
            test-results/forma-icon-print/
          if-no-files-found: warn

      - name: Record dependency lock
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
          else
            git commit -m "Lock print experiment test dependencies"
            git pull --rebase origin main
            git push
          fi
