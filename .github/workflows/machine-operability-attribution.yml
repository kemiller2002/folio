name: Complete machine-operability attribution

on:
  push:
    branches: [feature/machine-operability-contract]
    paths:
      - ".github/workflows/machine-operability-attribution.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attribute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Attribute FOLIO-GH-33
        shell: bash
        run: |
          set -euo pipefail
          WORK_ID="FOLIO-GH-33"
          BASE_SHA="$(git merge-base origin/main HEAD)"
          ./ros add "Make Folio output and interactions machine-operable" --id "$WORK_ID" --tag folio,machine-operability,automation --priority high --source github-issue --source-reference "https://github.com/kemiller2002/folio/issues/33" --actor "agent:openai-chatgpt"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ./ros work backlog-transition --action ready --id "$WORK_ID" --occurred-at "$NOW"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ./ros work start --id "$WORK_ID" --occurred-at "$NOW" --type task
          git rm .github/workflows/machine-operability-attribution.yml
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ROS_BASE_REF="$BASE_SHA" ./ros work complete --id "$WORK_ID" --occurred-at "$NOW" --evidence implementation=docs/requirements/MACHINE-OPERABILITY.md --evidence tests=tests/run-machine-operability-tests.mjs --evidence decision=research/decisions/DF-PRINT-2026-0006--adopt-machine-operability-and-semantic-inspectability.md
          ./ros registry build
          ROS_BASE_REF="$BASE_SHA" ./ros validate
          ./ros status

      - name: Commit attributed ROS state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -d .ros/telemetry ]; then git add -f .ros/telemetry; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "FOLIO-GH-33 record ROS attribution"
          git pull --rebase origin feature/machine-operability-contract
          git push origin HEAD:feature/machine-operability-contract
